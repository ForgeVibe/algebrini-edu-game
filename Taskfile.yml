version: '3'

# Algebrini Educational Game Taskfile
# Organized by categories with prefixes for better navigation

# ===== ENVIRONMENT & SETUP =====
env:status:
  desc: Check development environment status
  cmds:
    - echo "=== Environment Status ==="
    - echo "Flutter SDK: $(which flutter 2>/dev/null || echo 'Not found')"
    - echo "Dart SDK: $(which dart 2>/dev/null || echo 'Not found')"
    - echo "Node.js: $(which node 2>/dev/null || echo 'Not found')"
    - echo "npm: $(which npm 2>/dev/null || echo 'Not found')"
    - echo "Docker: $(which docker 2>/dev/null || echo 'Not found')"
    - echo "Docker Compose: $(which docker-compose 2>/dev/null || echo 'Not found')"
    - echo ""
    - echo "=== Database Status ==="
    - task: db:status

# ===== DATABASE MANAGEMENT =====
db:start:
  desc: Start development database stack
  cmds:
    - cd infra/database/dev
    - docker compose up -d
    - echo "Database stack started"
    - echo "PostgreSQL: localhost:5432"
    - echo "Redis: localhost:6379"
    - echo "pgAdmin: http://localhost:8081"

db:stop:
  desc: Stop development database stack
  cmds:
    - cd infra/database/dev
    - docker compose down
    - echo "Database stack stopped"

db:status:
  desc: Check database stack status
  cmds:
    - cd infra/database/dev
    - docker compose ps
    - echo ""
    - echo "Database connection test:"
    - docker compose exec -T postgres pg_isready -U algebrini_user || echo "PostgreSQL not ready"
    - docker compose exec -T redis redis-cli ping || echo "Redis not ready"

db:restart:
  desc: Restart development database stack
  cmds:
    - task: db:stop
    - task: db:start

db:logs:
  desc: Show database logs
  cmds:
    - cd infra/database/dev
    - docker compose logs --tail=50

db:backup:
  desc: Create database backup
  cmds:
    - cd infra/database
    - ./scripts/backup.sh dev

db:restore:
  desc: Restore database from backup
  cmds:
    - cd infra/database
    - ./scripts/restore.sh dev

db:monitor:
  desc: Monitor database performance
  cmds:
    - cd infra/database/dev
    - docker compose exec postgres psql -U algebrini_user -d algebrini_dev -c "SELECT version();"
    - echo ""
    - docker compose exec postgres psql -U algebrini_user -d algebrini_dev -c "SELECT count(*) as total_tables FROM information_schema.tables WHERE table_schema = 'public';"

# ===== API SERVER =====
api:install:
  desc: Install API server dependencies
  cmds:
    - cd api
    - npm install
    - echo "API dependencies installed"

api:start:
  desc: Start API server
  cmds:
    - cd api
    - nohup node server.js > api.log 2>&1 &
    - echo "API server started in background"
    - echo "Logs: api/api.log"

api:stop:
  desc: Stop API server
  cmds:
    - pkill -f "node server.js" || echo "No API server running"
    - echo "API server stopped"

api:status:
  desc: Check API server status
  cmds:
    - echo "API Server Status:"
    - curl -s http://localhost:3000/api/health || echo "API server not responding"
    - echo ""
    - echo "API endpoints:"
    - echo "  Health: http://localhost:3000/api/health"
    - echo "  Games: http://localhost:3000/api/games"
    - echo "  Chapters: http://localhost:3000/api/chapters"

api:test:
  desc: Test API endpoints
  cmds:
    - echo "Testing API endpoints..."
    - curl -s http://localhost:3000/api/health || echo "API server not running"
    - curl -s http://localhost:3000/api/games | head -c 100 || echo "Games endpoint not responding"

# ===== TESTING =====
test:unit:
  desc: Run unit tests
  cmds:
    - flutter test

test:integration:
  desc: Run integration tests
  cmds:
    - flutter test integration_test/

test:coverage:
  desc: Generate test coverage report
  cmds:
    - flutter test --coverage
    - genhtml coverage/lcov.info -o coverage/html
    - echo "Coverage report generated at coverage/html/index.html"

test:database:
  desc: Test database integration
  cmds:
    - echo "Testing database integration..."
    - task: db:status
    - task: api:test
    - echo "Database integration test completed"

# ===== BUILD & DEPLOY =====
build:android:
  desc: Build Android APK
  cmds:
    - flutter build apk --release
    - echo "APK built at build/app/outputs/flutter-apk/app-release.apk"

build:ios:
  desc: Build iOS app
  cmds:
    - flutter build ios --release
    - echo "iOS app built"

build:web:
  desc: Build web app
  cmds:
    - flutter build web --release
    - echo "Web app built at build/web/"

build:all:
  desc: Build for all platforms
  cmds:
    - task: build:android
    - task: build:web

# ===== CODE QUALITY =====
code:format:
  desc: Format Dart code
  cmds:
    - dart format lib/ test/ integration_test/

code:analyze:
  desc: Analyze Dart code
  cmds:
    - flutter analyze

code:lint:
  desc: Run linting
  cmds:
    - flutter analyze --fatal-infos

code:fix:
  desc: Fix common code issues
  cmds:
    - task: code:format
    - task: code:analyze

# ===== DEVELOPMENT WORKFLOW =====
dev:setup:
  desc: Complete development setup
  cmds:
    - echo "Setting up development environment..."
    - task: db:start
    - task: api:install
    - task: api:start
    - echo "Development environment ready!"

dev:start:
  desc: Start development environment
  cmds:
    - task: db:start
    - task: api:start

dev:stop:
  desc: Stop development environment
  cmds:
    - task: db:stop
    - task: api:stop
    - echo "Development environment stopped"

dev:reset:
  desc: Reset development environment
  cmds:
    - task: db:restart
    - task: api:install
    - task: api:start

# ===== CI/CD =====
ci:test:
  desc: Run CI test suite
  cmds:
    - task: code:lint
    - task: test:unit
    - task: test:coverage

ci:build:
  desc: Run CI build
  cmds:
    - task: build:all
    - echo "CI build completed"

# ===== UTILITIES =====
clean:
  desc: Clean build artifacts
  cmds:
    - flutter clean
    - rm -rf build/
    - rm -rf coverage/
    - echo "Build artifacts cleaned"

deps:get:
  desc: Get Flutter dependencies
  cmds:
    - flutter pub get

deps:upgrade:
  desc: Upgrade Flutter dependencies
  cmds:
    - flutter pub upgrade

deps:outdated:
  desc: Check for outdated dependencies
  cmds:
    - flutter pub deps

# ===== HELP =====
help:
  desc: Show available tasks
  cmds:
    - echo "Available task categories:"
    - echo "  env:*     - Environment and setup tasks"
    - echo "  db:*      - Database management tasks"
    - echo "  api:*     - API server tasks"
    - echo "  test:*    - Testing tasks"
    - echo "  build:*   - Build and deployment tasks"
    - echo "  code:*    - Code quality tasks"
    - echo "  dev:*     - Development workflow tasks"
    - echo "  ci:*      - CI/CD tasks"
    - echo "  deps:*    - Dependency management tasks"
    - echo ""
    - echo "Use 'task --list' to see all available tasks"
    - echo "Use 'task <task-name>' to run a specific task" 