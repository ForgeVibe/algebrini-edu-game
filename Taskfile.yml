version: '3'

# Algebrini Educational Game Taskfile
# Organized by categories with prefixes for better navigation.
# This version has been corrected for proper directory handling and dependency management.

vars:
  IMAGE_NAME: algebrini-flutter
  FLUTTER_VERSION: '3.19.6'
  FLUTTER_TAR: 'flutter_linux_{{.FLUTTER_VERSION}}-stable.tar.xz'
  FLUTTER_URL: 'https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/{{.FLUTTER_TAR}}'
  DOCKER_CONTEXT: '.'
  DOWNLOADS_DIR: './infra/downloads'
  CONTAINER_NAME: algebrini-dev
  APP_PORT: 5052
  PGADMIN_PORT: 8081
  API_PORT: 3000
  POSTGRES_PORT: 5432
  REDIS_PORT: 6379
  PROD_PORT: 5053
  WEB_PORT: 80

tasks:
  default:
    cmds:
      - task: help

  # ===== ENVIRONMENT & SETUP =====
  env:status:
    desc: Check development environment status
    silent: true
    cmds:
      - |
        echo '=== Algebrini Development Environment Status ==='
        echo ''
        echo '=== Docker Images ==='
        echo "Development:  $(docker image inspect {{.IMAGE_NAME}}:development >/dev/null 2>&1 && echo '✓ Built' || echo '✗ Not built')"
        echo "Testing:      $(docker image inspect {{.IMAGE_NAME}}:testing >/dev/null 2>&1 && echo '✓ Built' || echo '✗ Not built')"
        echo "Web Build:    $(docker image inspect {{.IMAGE_NAME}}:web-build >/dev/null 2>&1 && echo '✓ Built' || echo '✗ Not built')"
        echo "Production:   $(docker image inspect {{.IMAGE_NAME}}:production >/dev/null 2>&1 && echo '✓ Built' || echo '✗ Not built')"
        echo ''
        echo '=== Running Containers ==='
        docker ps --filter "ancestor={{.IMAGE_NAME}}:development" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || echo "No development containers running"
        echo ''
        echo '=== Database Stack ==='
        cd infra/database/dev && docker compose ps 2>/dev/null || echo "Database stack not running"
        echo ''
        echo '=== API Server ==='
        curl -s http://localhost:{{.API_PORT}}/api/health >/dev/null && echo "✓ API server running" || echo "✗ API server not responding"
        echo ''
        echo '=== Available Services ==='
        echo "Development Server: http://localhost:{{.APP_PORT}}"
        echo "Production Server:  http://localhost:{{.PROD_PORT}}"
        echo "API Server:         http://localhost:{{.API_PORT}}"
        echo "Database:           localhost:{{.POSTGRES_PORT}}"
        echo "pgAdmin:            http://localhost:{{.PGADMIN_PORT}}"

  env:check:
    desc: Comprehensive environment health check
    silent: true
    cmds:
      - |
        echo "=== Algebrini Environment Health Check ==="
        echo ""
        
        # Check Docker containers
        echo "📦 Docker Containers:"
        if docker ps | grep -q "algebrini_postgres_dev"; then
          echo "  ✅ PostgreSQL: Running"
        else
          echo "  ❌ PostgreSQL: Not running"
        fi
        
        if docker ps | grep -q "algebrini_redis_dev"; then
          echo "  ✅ Redis: Running"
        else
          echo "  ❌ Redis: Not running"
        fi
        
        if docker ps | grep -q "algebrini_api_dev"; then
          echo "  ✅ API Server: Running"
        else
          echo "  ❌ API Server: Not running"
        fi
        
        if docker ps | grep -q "algebrini_pgadmin_dev"; then
          echo "  ✅ pgAdmin: Running"
        else
          echo "  ❌ pgAdmin: Not running"
        fi
        
        if docker ps | grep -q "{{.CONTAINER_NAME}}"; then
          echo "  ✅ Flutter Dev Server: Running"
        else
          echo "  ❌ Flutter Dev Server: Not running"
        fi
        
        echo ""
        echo "🌐 Service Endpoints:"
        
        # Check service connectivity
        if curl -s http://localhost:{{.API_PORT}}/api/health >/dev/null 2>&1; then
          echo "  ✅ API Health: http://localhost:{{.API_PORT}}/api/health"
        else
          echo "  ❌ API Health: Not responding"
        fi
        
        if docker exec algebrini_postgres_dev pg_isready -U algebrini_user >/dev/null 2>&1; then
          echo "  ✅ PostgreSQL: localhost:{{.POSTGRES_PORT}}"
        else
          echo "  ❌ PostgreSQL: Not responding"
        fi
        
        if docker exec algebrini_redis_dev redis-cli ping >/dev/null 2>&1; then
          echo "  ✅ Redis: localhost:{{.REDIS_PORT}}"
        else
          echo "  ❌ Redis: Not responding"
        fi
        
        echo ""
        echo "🚀 Quick Start Commands:"
        echo "  task dev:setup     - Complete environment setup"
        echo "  task dev:start     - Start development server"
        echo "  task db:start      - Start database stack only"
        echo "  task redis:start   - Start Redis only"
        echo "  task api:start     - Start API server only"

  # ===== DOCKER HELPERS =====
  docker:check-dev:
    desc: Check if development Docker image exists (build if not)
    silent: true
    cmds:
      - docker image inspect {{.IMAGE_NAME}}:development >/dev/null 2>&1 || task docker:build-dev

  docker:build-dev:
    desc: Build development Docker image (if not exists)
    deps: [download-flutter]
    silent: true
    cmds:
      - docker image inspect {{.IMAGE_NAME}}:development >/dev/null 2>&1 || docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target development -t {{.IMAGE_NAME}}:development -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  docker:build-test:
    desc: Build testing Docker image (if not exists)
    deps: [download-flutter]
    silent: true
    cmds:
      - docker image inspect {{.IMAGE_NAME}}:testing >/dev/null 2>&1 || docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target testing -t {{.IMAGE_NAME}}:testing -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  docker:build-web:
    desc: Build web Docker image (if not exists)
    deps: [download-flutter]
    silent: true
    cmds:
      - docker image inspect {{.IMAGE_NAME}}:web-build >/dev/null 2>&1 || docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target web-build -t {{.IMAGE_NAME}}:web-build -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  docker:build-android:
    desc: Build Android Docker image (if not exists)
    deps: [download-flutter]
    silent: true
    cmds:
      - docker image inspect {{.IMAGE_NAME}}:android-build >/dev/null 2>&1 || docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target android-build -t {{.IMAGE_NAME}}:android-build -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  docker:build-ios:
    desc: Build iOS Docker image (if not exists)
    deps: [download-flutter]
    silent: true
    cmds:
      - docker image inspect {{.IMAGE_NAME}}:ios-build >/dev/null 2>&1 || docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target ios-build -t {{.IMAGE_NAME}}:ios-build -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  docker:build-prod:
    desc: Build production Docker image (if not exists)
    deps: [download-flutter]
    silent: true
    cmds:
      - docker image inspect {{.IMAGE_NAME}}:production >/dev/null 2>&1 || docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target production -t {{.IMAGE_NAME}}:production -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  download-flutter:
    desc: Download Flutter SDK if not present
    silent: true
    cmds:
      - |
        if [ ! -f "{{.DOWNLOADS_DIR}}/{{.FLUTTER_TAR}}" ]; then
          echo "Downloading Flutter SDK..."
          mkdir -p {{.DOWNLOADS_DIR}}
          wget -O "{{.DOWNLOADS_DIR}}/{{.FLUTTER_TAR}}" "{{.FLUTTER_URL}}"
          echo "Flutter SDK downloaded"
        else
          echo "Flutter SDK already present"
        fi

  # ===== DATABASE MANAGEMENT =====
  # Note: All 'db:*' tasks that use docker-compose now use the 'dir' property.
  db:start:
    desc: Start development database stack
    dir: infra/database/dev
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose up -d
      - "echo 'Database stack started'"
      - "echo 'PostgreSQL: localhost:{{.POSTGRES_PORT}}'"
      - "echo 'Redis: localhost:{{.REDIS_PORT}}'"
      - "echo 'pgAdmin: http://localhost:{{.PGADMIN_PORT}}'"

  db:stop:
    desc: Stop development database stack
    dir: infra/database/dev
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose down
      - "echo 'Database stack stopped'"

  db:status:
    desc: Check database stack status
    dir: infra/database/dev
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose ps
      - "echo ''"
      - "echo 'Database connection test:'"
      - docker compose exec -T postgres pg_isready -U algebrini_user || "echo 'PostgreSQL not ready'"
      - docker compose exec -T redis redis-cli ping || "echo 'Redis not ready'"

  db:restart:
    desc: Restart development database stack
    silent: true
    cmds:
      - task: db:stop
      - task: db:start

  db:logs:
    desc: Show database logs
    dir: infra/database/dev
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose logs --tail=50

  db:backup:
    desc: Create database backup
    dir: infra/database
    silent: true
    cmds:
      - cd infra/database
      - ./scripts/backup.sh dev

  db:restore:
    desc: Restore database from backup
    dir: infra/database
    silent: true
    cmds:
      - cd infra/database
      - ./scripts/restore.sh dev

  db:monitor:
    desc: Monitor database performance
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose exec postgres psql -U algebrini_user -d algebrini_dev -c "SELECT version();"
      - "echo ''"
      - docker compose exec postgres psql -U algebrini_user -d algebrini_dev -c "SELECT count(*) as total_tables FROM information_schema.tables WHERE table_schema = 'public';"

  # ===== REDIS MANAGEMENT =====
  redis:start:
    desc: Start Redis cache server
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose up -d redis
      - "echo 'Redis cache server started'"
      - "echo 'Redis: localhost:{{.REDIS_PORT}}'"

  redis:stop:
    desc: Stop Redis cache server
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose stop redis
      - "echo 'Redis cache server stopped'"

  redis:status:
    desc: Check Redis cache server status
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose ps redis
      - "echo ''"
      - "echo 'Redis connection test:'"
      - docker compose exec -T redis redis-cli ping || "echo 'Redis not ready'"

  redis:flush:
    desc: Flush Redis cache
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose exec -T redis redis-cli FLUSHALL
      - "echo 'Redis cache flushed'"

  redis:monitor:
    desc: Monitor Redis operations
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose exec -T redis redis-cli MONITOR

  redis:info:
    desc: Show Redis server information
    silent: true
    cmds:
      - cd infra/database/dev
      - docker compose exec -T redis redis-cli INFO

  # ===== API SERVER =====
  # Note: API tasks now use a PID file for reliable start/stop.
  api:install:
    desc: Install API server dependencies
    dir: api
    silent: true
    cmds:
      - cd api
      - npm install
      - "echo 'API dependencies installed'"

  api:start:
    desc: Start API server
    dir: api
    silent: true
    cmds:
      - cd api
      - nohup node server.js > api.log 2>&1 &
      - "echo 'API server started in background'"
      - "echo 'Logs api/api.log'"

  api:stop:
    desc: Stop API server
    dir: api
    silent: true
    cmds:
      - pkill -f "node server.js" || "echo 'No API server running'"
      - "echo 'API server stopped'"

  api:status:
    desc: Check API server status
    silent: true
    cmds:
      - "echo 'API Server Status:'"
      - curl -s http://localhost:{{.API_PORT}}/api/health || "echo 'API server not responding'"
      - "echo ''"
      - "echo 'API endpoints:'"
      - "echo '  Health: http://localhost:{{.API_PORT}}/api/health'"
      - "echo '  Games: http://localhost:{{.API_PORT}}/api/games'"
      - "echo '  Chapters: http://localhost:{{.API_PORT}}/api/chapters'"

  api:test:
    desc: Test API endpoints
    silent: true
    cmds:
      - "echo 'Testing API endpoints...'"
      - curl -s http://localhost:{{.API_PORT}}/api/health || "echo 'API server not running'"
      - curl -s http://localhost:{{.API_PORT}}/api/games | head -c 100 || "echo 'Games endpoint not responding'"

  # ===== TESTING =====
  test:unit:
    desc: Run unit tests
    deps: [docker:build-test]
    silent: true
    cmds:
      - docker run --rm {{.IMAGE_NAME}}:testing

  test:integration:
    desc: Run integration tests against development environment (detached)
    silent: true
    cmds:
      - |
        echo "🧪 Running integration tests against development environment in detached mode..."
        echo "📝 Logs will be written to integration_test.log"
        nohup docker run --rm --network host algebrini-flutter:testing flutter test tests/integration/ --reporter=expanded > integration_test.log 2>&1 &
        echo "✅ Integration tests started in background. Check integration_test.log for results."

  test:integration:cleanup:
    desc: Clean up integration test containers
    silent: true
    cmds:
      - docker compose -f infra/database/dev/compose.yml --profile test down

  test:coverage:
    desc: Generate test coverage report (detached)
    deps: [docker:build-test] # Ensure tests are run before generating coverage
    silent: true
    cmds:
      - |
        echo "📊 Generating test coverage report in detached mode..."
        nohup docker run --rm -v $(pwd)/coverage:/home/flutteruser/app/coverage {{.IMAGE_NAME}}:testing > coverage_test.log 2>&1 &
        echo "✅ Coverage report generation started in background. Check coverage_test.log for results."

  test:database:
    desc: Test database integration
    silent: true
    cmds:
      - "echo 'Testing database integration...'"
      - task: db:status
      - task: api:test
      - "echo 'Database integration test completed'"

  # ===== BUILD & DEPLOY =====
  build:android:
    desc: Build Android APK (detached)
    deps: [docker:build-android]
    silent: true
    cmds:
      - |
        echo "📱 Building Android APK in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:android-build > android_build.log 2>&1 &
        echo "✅ Android build started in background. Check android_build.log for results."

  build:ios:
    desc: Build iOS app (requires macOS) (detached)
    deps: [docker:build-ios]
    silent: true
    cmds:
      - |
        echo "🍎 Building iOS app in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:ios-build > ios_build.log 2>&1 &
        echo "✅ iOS build started in background. Check ios_build.log for results."

  build:web:
    desc: Build web app (detached)
    deps: [docker:build-web]
    silent: true
    cmds:
      - |
        echo "🌐 Building web app in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:web-build > web_build.log 2>&1 &
        echo "✅ Web build started in background. Check web_build.log for results."

  build:all:
    desc: Build for all platforms (detached)
    deps: [build:android, build:web]
    silent: true
    cmds:
      - |
        echo "🚀 Building for all platforms in detached mode..."
        echo "📱 Android build: android_build.log"
        echo "🌐 Web build: web_build.log"
        echo "✅ All builds started in background."

  # ===== COMPREHENSIVE TESTING =====
  test:smoke:
    desc: Run smoke tests (basic functionality) (detached)
    deps: [docker:build-test]
    silent: true
    cmds:
      - |
        echo "🔥 Running smoke tests in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:testing flutter test tests/unit/smoke_test.dart > smoke_test.log 2>&1 &
        echo "✅ Smoke tests started in background. Check smoke_test.log for results."

  test:regression:
    desc: Run regression tests (detached)
    deps: [docker:build-test]
    silent: true
    cmds:
      - |
        echo "🔄 Running regression tests in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:testing flutter test tests/unit/regression_test.dart > regression_test.log 2>&1 &
        echo "✅ Regression tests started in background. Check regression_test.log for results."

  test:performance:
    desc: Run performance tests (detached)
    deps: [docker:build-test]
    silent: true
    cmds:
      - |
        echo "⚡ Running performance tests in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:testing flutter test tests/unit/ --coverage --reporter=json --dart-define=performance_test=true > performance_test.log 2>&1 &
        echo "✅ Performance tests started in background. Check performance_test.log for results."

  test:accessibility:
    desc: Run accessibility tests (detached)
    deps: [docker:build-test]
    silent: true
    cmds:
      - |
        echo "♿ Running accessibility tests in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:testing flutter test tests/integration/ --dart-define=accessibility_test=true > accessibility_test.log 2>&1 &
        echo "✅ Accessibility tests started in background. Check accessibility_test.log for results."

  test:responsive:
    desc: Run responsive design tests (detached)
    deps: [docker:build-test]
    silent: true
    cmds:
      - |
        echo "📱 Running responsive design tests in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:testing flutter test tests/integration/web_test.dart --dart-define=responsive_test=true > responsive_test.log 2>&1 &
        echo "✅ Responsive tests started in background. Check responsive_test.log for results."

  test:mobile:
    desc: Run mobile-specific tests (detached)
    deps: [docker:build-test]
    silent: true
    cmds:
      - |
        echo "📱 Running mobile-specific tests in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:testing flutter test tests/integration/app_test.dart --dart-define=mobile_test=true > mobile_test.log 2>&1 &
        echo "✅ Mobile tests started in background. Check mobile_test.log for results."

  test:web:
    desc: Run web-specific tests (detached)
    deps: [docker:build-test]
    silent: true
    cmds:
      - |
        echo "🌐 Running web-specific tests in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:testing flutter test tests/integration/web_test.dart --dart-define=web_test=true > web_test.log 2>&1 &
        echo "✅ Web tests started in background. Check web_test.log for results."

  test:nightly:
    desc: Run nightly test suite (comprehensive) (detached)
    deps: [docker:build-test]
    silent: true
    cmds:
      - |
        echo "🌙 Running nightly test suite in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:testing bash -c "flutter test tests/unit/ && flutter test tests/integration/ && flutter test tests/unit/ --coverage" > nightly_test.log 2>&1 &
        echo "✅ Nightly test suite started in background. Check nightly_test.log for results."

  test:weekly:
    desc: Run weekly test suite (extended) (detached)
    deps: [docker:build-test]
    silent: true
    cmds:
      - |
        echo "📅 Running weekly test suite in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:testing bash -c "flutter test tests/unit/ && flutter test tests/integration/ && flutter test tests/unit/ --coverage --dart-define=performance_test=true" > weekly_test.log 2>&1 &
        echo "✅ Weekly test suite started in background. Check weekly_test.log for results."

  test:monthly:
    desc: Run monthly test suite (full regression) (detached)
    deps: [docker:build-test]
    silent: true
    cmds:
      - |
        echo "📆 Running monthly test suite in detached mode..."
        nohup docker run --rm {{.IMAGE_NAME}}:testing bash -c "flutter test tests/unit/ && flutter test tests/integration/ && flutter test tests/unit/ --coverage --dart-define=performance_test=true --dart-define=regression_test=true" > monthly_test.log 2>&1 &
        echo "✅ Monthly test suite started in background. Check monthly_test.log for results."

  # ===== CODE QUALITY =====
  code:format:
    desc: Format Dart code
    deps: [docker:check-dev]
    silent: true
    cmds:
      - docker run --rm -v $(pwd):/home/flutteruser/app {{.IMAGE_NAME}}:development dart format lib/ test/ integration_test/

  code:analyze:
    desc: Analyze Dart code
    deps: [docker:check-dev]
    silent: true
    cmds:
      - docker run --rm -v $(pwd):/home/flutteruser/app {{.IMAGE_NAME}}:development flutter analyze

  code:lint:
    desc: Run linting
    deps: [docker:check-dev]
    silent: true
    cmds:
      - docker run --rm -v $(pwd):/home/flutteruser/app {{.IMAGE_NAME}}:development flutter analyze --fatal-infos

  code:fix:
    desc: Format and analyze code
    deps: [code:format, code:analyze]
    silent: true

  # ===== DEVELOPMENT ENVIRONMENT =====
  dev:setup:
    desc: Initial development environment setup
    cmds:
      - task db:setup
      - task api:setup
      - echo "✅ Development environment setup complete"

  dev:start:
    desc: Start development environment (background)
    deps: [dev:ensure-db-stack]
    cmds:
      - |
        echo "🚀 Starting Algebrini development environment..."
        docker run -d --name algebrini_app_dev -p {{.APP_PORT}}:5000 --network algebrini_dev_network algebrini-flutter:development
        echo "✅ Development environment started"
        echo "🌐 App available at: http://localhost:{{.APP_PORT}}"
        echo "📊 pgAdmin available at: http://localhost:{{.PGADMIN_PORT}}"
        echo "🔧 API available at: http://localhost:{{.API_PORT}}"

  dev:start-fg:
    desc: Start development environment (foreground)
    deps: [dev:ensure-db-stack]
    cmds:
      - |
        echo "🚀 Starting Algebrini development environment (foreground)..."
        echo "🌐 App will be available at: http://localhost:{{.APP_PORT}}"
        echo "📊 pgAdmin available at: http://localhost:{{.PGADMIN_PORT}}"
        echo "🔧 API available at: http://localhost:{{.API_PORT}}"
        echo "Press Ctrl+C to stop"
        docker run --rm --name algebrini_app_dev -p {{.APP_PORT}}:5000 --network algebrini_dev_network algebrini-flutter:development

  dev:ensure-db-stack:
    desc: Ensure database stack is running (internal task)
    internal: true
    cmds:
      - |
        if ! docker ps | grep -q "algebrini_postgres_dev"; then
          echo "📦 Starting database stack..."
          task db:start
        else
          echo "✅ Database stack already running"
        fi

  dev:stop:
    desc: Stop development server
    cmds:
      - |
        echo "Stopping development server..."
        docker stop {{.CONTAINER_NAME}} 2>/dev/null || echo "No running development container found"
        docker rm {{.CONTAINER_NAME}} 2>/dev/null || echo "No development container to remove"

  dev:restart:
    desc: Restart development server
    cmds:
      - task: dev:stop
      - task: dev:start

  dev:reset:
    desc: Reset development environment (stop all, clean, restart)
    cmds:
      - task: dev:stop
      - task: stop-all
      - task: clean
      - task: dev:setup
      - task: dev:start

  dev:logs:
    desc: View development server logs
    cmds:
      - docker logs -f {{.CONTAINER_NAME}}

  # ===== LEGACY ALIASES (for backward compatibility) =====
  dev:
    desc: Start development server (alias for dev:start)
    deps: [dev:start]

  dev-fg:
    desc: Start development server foreground (alias for dev:start-fg)
    deps: [dev:start-fg]

  test:
    desc: Run all tests with coverage (detached)
    deps: [docker:build-test]
    cmds:
      - |
        echo "🧪 Running all tests in detached mode..."
        echo "📝 Logs will be written to all_tests.log"
        nohup docker run --rm {{.IMAGE_NAME}}:testing bash -c "flutter test tests/unit/ && echo 'Running integration tests...' && flutter test tests/integration/" > all_tests.log 2>&1 &
        echo "✅ All tests started in background. Check all_tests.log for results."

  serve-web:
    desc: Serve production web app with nginx (detached)
    deps: [docker:build-prod]
    silent: true
    cmds:
      - |
        echo "🌐 Starting production web server in detached mode..."
        nohup docker run --rm -p {{.WEB_PORT}}:80 {{.IMAGE_NAME}}:production > web_server.log 2>&1 &
        echo "✅ Production web server started in background. Check web_server.log for logs."
        echo "🌐 Web app available at: http://localhost:{{.WEB_PORT}}"

  stop-all:
    desc: Stop all Algebrini containers
    cmds:
      - |
        echo "Stopping all Algebrini containers..."
        docker ps -q --filter "ancestor={{.IMAGE_NAME}}:development" | xargs -r docker stop
        docker ps -aq --filter "ancestor={{.IMAGE_NAME}}:development" | xargs -r docker rm

  # ===== CI/CD =====
  ci:test:
    desc: Run CI test suite
    deps: [code:analyze, test:coverage]

  ci:build:
    desc: Run CI build
    deps: [build:all]
    cmds:
      - echo "CI build completed"

  # ===== UTILITIES =====
  clean:
    desc: Clean build artifacts and temporary files
    cmds:
      - |
        echo "Cleaning up Docker resources..."
        task stop-all
        docker system prune -f
        docker rmi {{.IMAGE_NAME}}:development {{.IMAGE_NAME}}:testing {{.IMAGE_NAME}}:web-build {{.IMAGE_NAME}}:android-build {{.IMAGE_NAME}}:ios-build {{.IMAGE_NAME}}:production 2>/dev/null || true
        rm -rf build/
        rm -rf coverage/
        rm -f api/.api.pid api/api.log
        echo "Build artifacts and temporary files cleaned."

  clean-all:
    desc: Clean everything including Flutter SDK
    cmds:
      - |
        task clean
        rm -f {{.DOWNLOADS_DIR}}/{{.FLUTTER_TAR}}
        echo "Complete cleanup finished"

  status:
    desc: Show development environment status
    silent: true
    cmds:
      - |
        echo "Algebrini Development Environment Status"
        echo "========================================"
        echo "Docker containers:"
        docker ps --filter "ancestor={{.IMAGE_NAME}}:development" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        echo ""
        echo "Available ports:"
        echo "  Development: http://localhost:{{.APP_PORT}}"
        echo "  Production:  http://localhost:{{.PROD_PORT}}"
        echo ""
        echo "Useful commands:"
        echo "  task dev:start     - Start development server (background)"
        echo "  task dev:start-fg  - Start development server (foreground)"
        echo "  task dev:logs      - View development server logs"
        echo "  task dev:stop      - Stop development server"
        echo "  task dev:restart   - Restart development server"
        echo "  task dev:setup     - Setup complete environment"
        echo "  task status        - Show environment status"

  deps:get:
    desc: Get Flutter dependencies
    deps: [docker:check-dev]
    cmds:
      - docker run --rm -v $(pwd):/home/flutteruser/app {{.IMAGE_NAME}}:development flutter pub get

  deps:upgrade:
    desc: Upgrade Flutter dependencies
    deps: [docker:check-dev]
    cmds:
      - docker run --rm -v $(pwd):/home/flutteruser/app {{.IMAGE_NAME}}:development flutter pub upgrade

  deps:outdated:
    desc: Check for outdated dependencies
    deps: [docker:check-dev]
    cmds:
      - docker run --rm -v $(pwd):/home/flutteruser/app {{.IMAGE_NAME}}:development flutter pub outdated

  deps:build-runner:
    desc: Generate missing files with build_runner
    deps: [docker:check-dev]
    cmds:
      - docker run --rm -v $(pwd):/home/flutteruser/app {{.IMAGE_NAME}}:development flutter pub run build_runner build --delete-conflicting-outputs

  # ===== HELP =====
  help:
    desc: Show available tasks
    silent: true
    cmds:
      - |
        echo "Algebrini Educational Game - Task Commands"
        echo "=========================================="
        echo ""
        echo "Development Commands:"
        echo "  task dev:setup     - Complete development environment setup"
        echo "  task dev:start     - Start development server (background)"
        echo "  task dev:start-fg  - Start development server (foreground)"
