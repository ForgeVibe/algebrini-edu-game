version: '3'

# Global variables
vars:
  IMAGE_NAME: algebrini-flutter
  FLUTTER_VERSION: '3.19.6'
  FLUTTER_TAR: 'flutter_linux_{{.FLUTTER_VERSION}}-stable.tar.xz'
  FLUTTER_URL: 'https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/{{.FLUTTER_TAR}}'
  DOCKER_CONTEXT: './infra/docker'
  DOWNLOADS_DIR: './infra/downloads'

tasks:
  # Development tasks
  dev:
    desc: Start development environment with hot reload
    deps: [download-flutter, build-dev]
    cmds:
      - echo "🚀 Starting Algebrini development server..."
      - docker run --rm -p 5000:5000 -p 8080:8080 {{.IMAGE_NAME}}:development
    sources:
      - lib/**
      - pubspec.yaml
    generates:
      - .dart_tool/

  build-dev:
    desc: Build development Docker image
    deps: [download-flutter]
    cmds:
      - echo "🏗️ Building development image..."
      - docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target development -t {{.IMAGE_NAME}}:development {{.DOCKER_CONTEXT}}

  # Testing tasks
  test:
    desc: Run all tests with coverage
    deps: [download-flutter, build-test]
    cmds:
      - echo "🧪 Running tests..."
      - docker run --rm {{.IMAGE_NAME}}:testing
    sources:
      - lib/**
      - test/**
      - pubspec.yaml

  build-test:
    desc: Build testing Docker image
    deps: [download-flutter]
    cmds:
      - echo "🏗️ Building test image..."
      - docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target testing -t {{.IMAGE_NAME}}:testing {{.DOCKER_CONTEXT}}

  # Build tasks
  build-web:
    desc: Build web app for production
    deps: [download-flutter, build-web-image]
    cmds:
      - echo "🌐 Web app built successfully"
    sources:
      - lib/**
      - assets/**
      - pubspec.yaml

  build-web-image:
    desc: Build web production Docker image
    deps: [download-flutter]
    cmds:
      - echo "🏗️ Building web production image..."
      - docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target web-build -t {{.IMAGE_NAME}}:web-build {{.DOCKER_CONTEXT}}

  build-android:
    desc: Build Android APK
    deps: [download-flutter, build-android-image]
    cmds:
      - echo "📱 Android APK built successfully"
    sources:
      - lib/**
      - assets/**
      - pubspec.yaml

  build-android-image:
    desc: Build Android Docker image
    deps: [download-flutter]
    cmds:
      - echo "🏗️ Building Android image..."
      - docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target android-build -t {{.IMAGE_NAME}}:android-build {{.DOCKER_CONTEXT}}

  # Production tasks
  serve-web:
    desc: Serve production web app with nginx
    deps: [download-flutter, build-prod]
    cmds:
      - echo "🌐 Starting production web server..."
      - docker run --rm -p 80:80 {{.IMAGE_NAME}}:production

  build-prod:
    desc: Build production Docker image
    deps: [download-flutter]
    cmds:
      - echo "🏗️ Building production image..."
      - docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target production -t {{.IMAGE_NAME}}:production {{.DOCKER_CONTEXT}}

  # Utility tasks
  download-flutter:
    desc: Download Flutter SDK if not present
    cmds:
      - |
        if [ ! -f "{{.DOWNLOADS_DIR}}/{{.FLUTTER_TAR}}" ]; then
          echo "⬇️ Downloading Flutter SDK..."
          mkdir -p {{.DOWNLOADS_DIR}}
          wget -O "{{.DOWNLOADS_DIR}}/{{.FLUTTER_TAR}}" "{{.FLUTTER_URL}}"
          echo "✅ Flutter SDK downloaded"
        else
          echo "✅ Flutter SDK already present"
        fi
    sources:
      - pubspec.yaml

  clean:
    desc: Clean Docker images and containers
    cmds:
      - echo "🧹 Cleaning up Docker resources..."
      - docker system prune -f
      - docker rmi {{.IMAGE_NAME}}:development {{.IMAGE_NAME}}:testing {{.IMAGE_NAME}}:web-build {{.IMAGE_NAME}}:android-build {{.IMAGE_NAME}}:production 2>/dev/null || true
      - echo "✅ Cleanup completed"

  clean-all:
    desc: Clean everything including Flutter SDK
    cmds:
      - task: clean
      - rm -f {{.DOWNLOADS_DIR}}/{{.FLUTTER_TAR}}
      - echo "✅ Complete cleanup finished"

  # CI/CD tasks
  ci:
    desc: Run complete CI/CD pipeline
    deps: [test, build-web, build-android]
    cmds:
      - echo "✅ CI/CD pipeline completed successfully"

  # Documentation tasks
  docs:
    desc: Show available tasks
    cmds:
      - task --list

  help:
    desc: Show detailed help
    cmds:
      - echo "Algebrini Flutter Development Tasks"
      - echo ""
      - echo "Development:"
      - echo "  task dev          - Start development server (default)"
      - echo "  task test         - Run all tests"
      - echo ""
      - echo "Building:"
      - echo "  task build-web    - Build web app for production"
      - echo "  task build-android - Build Android APK"
      - echo "  task serve-web    - Serve production web app"
      - echo ""
      - echo "CI/CD:"
      - echo "  task ci           - Run complete pipeline"
      - echo ""
      - echo "Utilities:"
      - echo "  task clean        - Clean Docker resources"
      - echo "  task clean-all    - Clean everything"
      - echo "  task docs         - Show all tasks"
      - echo ""
      - echo "For more details, see: infra/docs/README-Docker.md" 