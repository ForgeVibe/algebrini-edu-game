version: '3'

vars:
  IMAGE_NAME: algebrini-flutter
  FLUTTER_VERSION: '3.19.6'
  FLUTTER_TAR: 'flutter_linux_{{.FLUTTER_VERSION}}-stable.tar.xz'
  FLUTTER_URL: 'https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/{{.FLUTTER_TAR}}'
  DOCKER_CONTEXT: '.'
  DOWNLOADS_DIR: './infra/downloads'
  CONTAINER_NAME: algebrini-dev

tasks:
  # ============================================================================
  # ENVIRONMENT TASKS
  # ============================================================================
  
  env:dev:
    desc: Start development environment with hot reload (background)
    deps: [env:download-flutter, env:build-dev]
    cmds:
      - |
        echo "Starting Algebrini development server in background..."
        docker run -d -p 5052:5000 -p 5053:8080 --name {{.CONTAINER_NAME}} {{.IMAGE_NAME}}:development
        echo "Development server started in background"
        echo "App available at: http://localhost:5052"
        echo "Logs available with: task env:logs"

  env:dev-fg:
    desc: Start development environment with hot reload (foreground)
    deps: [env:download-flutter, env:build-dev]
    cmds:
      - |
        echo "Starting Algebrini development server..."
        docker run --rm -p 5052:5000 -p 5053:8080 {{.IMAGE_NAME}}:development

  env:build-dev:
    desc: Build development Docker image
    deps: [env:download-flutter]
    cmds:
      - |
        echo "Building development image..."
        docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target development -t {{.IMAGE_NAME}}:development -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  env:stop:
    desc: Stop Algebrini development containers
    cmds:
      - |
        echo "Stopping Algebrini containers..."
        docker stop {{.CONTAINER_NAME}} 2>/dev/null || echo "No running Algebrini container found"
        docker rm {{.CONTAINER_NAME}} 2>/dev/null || echo "No Algebrini container to remove"

  env:stop-all:
    desc: Stop all Algebrini containers
    cmds:
      - |
        echo "Stopping all Algebrini containers..."
        docker ps -q --filter "ancestor={{.IMAGE_NAME}}:development" | xargs -r docker stop
        docker ps -aq --filter "ancestor={{.IMAGE_NAME}}:development" | xargs -r docker rm

  env:logs:
    desc: View development server logs
    cmds:
      - docker logs -f {{.CONTAINER_NAME}}

  env:restart:
    desc: Restart development server
    cmds:
      - task: env:stop
      - task: env:dev

  env:status:
    desc: Show development environment status
    cmds:
      - |
        echo "Algebrini Development Environment Status"
        echo "========================================"
        echo "Docker containers:"
        docker ps --filter "ancestor={{.IMAGE_NAME}}:development" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        echo ""
        echo "Available ports:"
        echo "  Development: http://localhost:5052"
        echo "  Production:  http://localhost:5053"
        echo ""
        echo "Useful commands:"
        echo "  task env:dev       - Start development server in background"
        echo "  task env:logs      - View development logs"
        echo "  task env:stop      - Stop development server"
        echo "  task env:restart   - Restart development server"
        echo "  task env:status    - Show environment status"

  env:download-flutter:
    desc: Download Flutter SDK if not present
    cmds:
      - |
        if [ ! -f "{{.DOWNLOADS_DIR}}/{{.FLUTTER_TAR}}" ]; then
          echo "Downloading Flutter SDK..."
          mkdir -p {{.DOWNLOADS_DIR}}
          wget -O "{{.DOWNLOADS_DIR}}/{{.FLUTTER_TAR}}" "{{.FLUTTER_URL}}"
          echo "Flutter SDK downloaded"
        else
          echo "Flutter SDK already present"
        fi

  env:clean:
    desc: Clean Docker images and containers
    cmds:
      - |
        echo "Cleaning up Docker resources..."
        task: env:stop-all
        docker system prune -f
        docker rmi {{.IMAGE_NAME}}:development {{.IMAGE_NAME}}:testing {{.IMAGE_NAME}}:web-build {{.IMAGE_NAME}}:android-build {{.IMAGE_NAME}}:production 2>/dev/null || true
        echo "Cleanup completed"

  env:clean-all:
    desc: Clean everything including Flutter SDK
    cmds:
      - |
        task: env:clean
        rm -f {{.DOWNLOADS_DIR}}/{{.FLUTTER_TAR}}
        echo "Complete cleanup finished"

  # ============================================================================
  # TESTING TASKS
  # ============================================================================

  test:run:
    desc: Run all tests with coverage
    deps: [env:download-flutter, test:build]
    cmds:
      - |
        echo "Running tests..."
        docker run --rm {{.IMAGE_NAME}}:testing flutter test tests/

  test:integration:
    desc: Run integration tests for Android and Web
    deps: [env:download-flutter, test:build]
    cmds:
      - |
        echo "Running integration tests..."
        docker run --rm {{.IMAGE_NAME}}:testing flutter test tests/integration/

  test:coverage:
    desc: Run tests with coverage report
    deps: [env:download-flutter, test:build]
    cmds:
      - |
        echo "Running tests with coverage..."
        docker run --rm {{.IMAGE_NAME}}:testing flutter test tests/unit/ --coverage
        echo "Coverage report generated"

  test:build:
    desc: Build testing Docker image
    deps: [env:download-flutter]
    cmds:
      - |
        echo "Building test image..."
        docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target testing -t {{.IMAGE_NAME}}:testing -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  # ============================================================================
  # BUILD TASKS
  # ============================================================================

  build:web:
    desc: Build web app for production
    deps: [env:download-flutter, build:web-image]
    cmds:
      - echo "Web app built successfully"

  build:web-image:
    desc: Build web production Docker image
    deps: [env:download-flutter]
    cmds:
      - |
        echo "Building web production image..."
        docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target web-build -t {{.IMAGE_NAME}}:web-build -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  build:android:
    desc: Build Android APK
    deps: [env:download-flutter, build:android-image]
    cmds:
      - echo "Android APK built successfully"

  build:android-image:
    desc: Build Android Docker image
    deps: [env:download-flutter]
    cmds:
      - |
        echo "Building Android image..."
        docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target android-build -t {{.IMAGE_NAME}}:android-build -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  build:prod:
    desc: Build production Docker image
    deps: [env:download-flutter]
    cmds:
      - |
        echo "Building production image..."
        docker build --build-arg FLUTTER_TAR={{.FLUTTER_TAR}} --target production -t {{.IMAGE_NAME}}:production -f infra/docker/Dockerfile {{.DOCKER_CONTEXT}}

  # ============================================================================
  # DEPLOYMENT TASKS
  # ============================================================================

  deploy:web:
    desc: Serve production web app with nginx
    deps: [env:download-flutter, build:prod]
    cmds:
      - |
        echo "Starting production web server..."
        docker run --rm -p 80:80 {{.IMAGE_NAME}}:production

  # ============================================================================
  # CODE QUALITY TASKS
  # ============================================================================

  code:format:
    desc: Format Dart code
    deps: [env:build-dev]
    cmds:
      - |
        echo "Formatting code..."
        docker run --rm -v $(pwd):/home/flutteruser/app {{.IMAGE_NAME}}:development flutter format .

  code:analyze:
    desc: Analyze Dart code
    deps: [env:build-dev]
    cmds:
      - |
        echo "Analyzing code..."
        docker run --rm {{.IMAGE_NAME}}:development flutter analyze

  # ============================================================================
  # CI/CD TASKS
  # ============================================================================

  ci:run:
    desc: Run complete CI/CD pipeline
    deps: [test:run, build:web, build:android]
    cmds:
      - echo "CI/CD pipeline completed successfully"

  # ============================================================================
  # UTILITY TASKS
  # ============================================================================

  help:
    desc: Show detailed help
    cmds:
      - |
        echo "Algebrini Educational Game - Task Commands"
        echo "=========================================="
        echo ""
        echo "Environment Commands:"
        echo "  task env:dev       - Start development server in background"
        echo "  task env:dev-fg    - Start development server (foreground)"
        echo "  task env:logs      - View development server logs"
        echo "  task env:stop      - Stop development server"
        echo "  task env:restart   - Restart development server"
        echo "  task env:status    - Show environment status"
        echo "  task env:clean     - Clean Docker resources"
        echo ""
        echo "Build Commands:"
        echo "  task build:web     - Build web app for production"
        echo "  task build:android - Build Android APK"
        echo ""
        echo "Testing Commands:"
        echo "  task test:run      - Run Flutter tests"
        echo "  task test:integration - Run integration tests"
        echo "  task test:coverage - Run tests with coverage"
        echo ""
        echo "Code Quality Commands:"
        echo "  task code:format   - Format Dart code"
        echo "  task code:analyze  - Analyze Dart code"
        echo ""
        echo "Deployment Commands:"
        echo "  task deploy:web    - Serve production web app"
        echo ""
        echo "CI/CD Commands:"
        echo "  task ci:run        - Run complete CI/CD pipeline"
        echo ""
        echo "For more information, run: task --list"

  default:
    desc: Show help by default
    cmds:
      - task: help 