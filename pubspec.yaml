name: algebrini_edu_game
version: 0.1.0
publish_to: 'none'
description: A kid-friendly educational algebra game (MVP).
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.0
  intl: ^0.18.0
  cupertino_icons: ^1.0.2
