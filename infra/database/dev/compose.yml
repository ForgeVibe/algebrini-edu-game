version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: algebrini_postgres_dev
    environment:
      POSTGRES_DB: algebrini_dev
      POSTGRES_USER: algebrini_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algebrini_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../schemas/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../schemas/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ../scripts/backup.sh:/usr/local/bin/backup.sh
      - ../scripts/restore.sh:/usr/local/bin/restore.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algebrini_user -d algebrini_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: algebrini_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@algebrini.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    container_name: algebrini_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API server
  api:
    build:
      context: ../../../api
      dockerfile: Dockerfile
    container_name: algebrini_api_dev
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: algebrini_dev
      DB_USER: algebrini_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-algebrini_dev_password}
      # Load configuration - change this to 'highLoad' when needed
      LOAD_LEVEL: ${LOAD_LEVEL:-standard}
      # Redis configuration for caching
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Performance monitoring
      ENABLE_METRICS: ${ENABLE_METRICS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Integration test service
  integration-tests:
    image: algebrini-flutter:testing
    container_name: algebrini_integration_tests
    environment:
      # Database connection for tests
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: algebrini_dev
      DB_USER: algebrini_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-algebrini_dev_password}
      # API connection for tests
      API_HOST: api
      API_PORT: 3000
      API_BASE_URL: http://api:3000/api
      # Test configuration
      FLUTTER_TEST: "true"
      INTEGRATION_TEST: "true"
    volumes:
      - ../../../:/home/flutteruser/app
      - /home/flutteruser/app/.dart_tool
      - /home/flutteruser/app/build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    profiles:
      - test
    command: flutter test tests/integration/ --reporter=expanded

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: algebrini_dev_network 